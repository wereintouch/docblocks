name: Check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# The full local gate (lint, format, build, typecheck, deprecations, unit,
# packaging, E2E) over the supported Node versions (the root package.json
# engines floor + the current major).
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    env:
      # The runner stands 2 vCPUs: the E2E suite runs single-worker (the
      # local default of four is tuned for a 16-core machine). At two
      # workers the keyboard gestures and the sync/presence polls flake
      # under the runner's load (a different test per run); one worker
      # leaves the machine the slack the settle polls need.
      PLAYWRIGHT_WORKERS: "1"
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24.15.0", "26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the E2E browser
        run: npx playwright install --with-deps chromium

      - name: Run the full local gate
        run: npm run check
