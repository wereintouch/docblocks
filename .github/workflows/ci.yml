name: Check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# The full local gate (lint, format, build, typecheck, deprecations,
# changesets, unit, packaging, E2E) over the supported Node versions (the
# root package.json's engines floor + the current major). The E2E stands the
# node 22's job only: the e2e's dev server (vite) crashes with the illegal
# instruction's SIGILL under the node 24/26's V8 on the runner's cpu (the
# dep's optimization's load), and the e2e's result stands the node's
# version's independent (the browser's tests stand the product, not the
# node's runtime).
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    env:
      # The runner stands 2 vCPUs: the E2E suite runs single-worker (the
      # local default of four is tuned for the high-core local machine's
      # load class). At two workers the keyboard gestures and the
      # sync/presence polls flake under the runner's load (a different
      # test per run); one worker leaves the machine the slack the settle
      # polls need.
      PLAYWRIGHT_WORKERS: "1"
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24.15.0", "26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the E2E browser
        if: matrix.node == '22.22.2'
        run: npx playwright install --with-deps chromium

      # The full local gate's steps (npm run check) minus the e2e (the node
      # 22's job stands it below) — the steps stand the root package.json's
      # check script's order.
      - name: Run the static + the unit + the packaging gates
        run: |
          npm run lint
          npm run format:check
          npm run build
          npm run typecheck
          npm run check:deprecations
          npm run check:changesets
          npm test
          npm run test:packaging

      - name: Run the E2E gate
        if: matrix.node == '22.22.2'
        # Two retries (three attempts) stand the weak-runner's load-flake
        # class (the sync / presence's poll over the 2 vCPU's runner's load —
        # the failed spec's re-run, codified over the runner): a deterministic
        # failure stands red over the retries. The runner is time-cheap here
        # (the gate's wall clock is not the budget), so the extra attempts
        # trade time for green.
        run: npm run test:e2e -- --retries=2
