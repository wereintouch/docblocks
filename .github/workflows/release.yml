name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal permissions for the changesets release: it opens Version PRs and
# pushes the version tag; publishing uses the npm registry token.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The protected environment: publishing stands behind the `npm`
    # environment (a required reviewer can gate it in the repository
    # settings).
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        uses: changesets/action@v1
        with:
          # The version step stands the no-op over the main without
          # the pending changesets (the version bump stands committed
          # before the merge to main).
          version: npx changeset version
          # The publish stands manual (the make publish step over the
          # release): the input's no-op keeps the job publish-free even
          # when a version tag stands over the main's HEAD.
          publish: 'echo "publish stands manual: make publish"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
